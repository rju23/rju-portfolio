<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Visualizer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b10; }
      #wrap { height: 100%; display: grid; place-items: center; }
      canvas { width: 100%; height: 100%; display: block; }
      #btn {
        position: absolute; top: 16px; left: 16px;
        padding: 10px 14px; border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        color: white; cursor: pointer;
      }
      #hint {
        position: absolute; top: 58px; left: 16px;
        color: rgba(255,255,255,0.65); font: 12px system-ui;
      }

      #hud{
        position:absolute; top:16px; right:16px;
        padding:10px 12px; border-radius:12px;
        border:1px solid rgba(255,255,255,0.12);
        background:rgba(0,0,0,0.35);
        color:rgba(255,255,255,0.88);
        font:12px system-ui;
        backdrop-filter: blur(8px);
      }
      #hud label{ display:flex; gap:10px; align-items:center; }
      #hud input{ width:160px; }
      
  </style>
    <script type="module" crossorigin src="/music-visualizer/assets/index-Cwk76hq7.js"></script>
  </head>
  <body>
    <button id="btn">Start mic</button>
    <div id="hud">
      <label>
        Sensitivity
        <input id="sens" type="range" min="0.5" max="3.0" step="0.05" value="1.40" />
        <span id="sensVal">1.40</span>
      </label>
    </div>
    <div id="hint">Click Start → allow microphone<br/>Modes: [1] Radial  [2] Waveform  [3] Both</div>
    <canvas id="c"></canvas>
  </body>
</html>
